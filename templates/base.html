<!DOCTYPE html>
<html lang=en>
<head>
    <title>Meal Curator - {% block title %}Making Eating at Home Easier{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="/flavicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Antic+Slab&family=Be+Vietnam+Pro:wght@300&family=Zilla+Slab:ital,wght@0,400;0,600;1,500&display=swap');
        h1 {
            font-family: 'Antic Slab', serif;
            font-size: 64px;
        }
        h2 {
            font-family: 'Zilla Slab', serif;
            font-weight: 600;
            font-size: 32px;
            color: #16a32e;
        }
        h3 {
            font-family: 'Zilla Slab', serif;
            font-weight: 500;
            font-size: 28px;
            font-style: italic;
        }
        h4 {
            font-family: 'Zilla Slab', serif;
            font-weight: 400;
            font-size: 24px;
            color: #1005ff;
        }
        
        p {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 300;
            font-size: 18px;
        }
        body {
            background-color: #fff2ee;
            color: #000;
            }
        table {
            margin-right: auto;
            margin-left: auto;
            text-align: ceter;;
        }

        .navbar{
        background-color:#16a32e ;
        width: 100%;
        display: flex;
        flex-flow: row wrap;
        justify-content: space-evenly;
        align-content: space-around;
        }

        
        .button {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 300;
            font-size: 18px;
            text-decoration: none;
            background-color: #fffffe;
            color: #000;
            padding: 2px 6px 2px 6px;
            border-top: 1px solid #CCCCCC;
            border-right: 1px solid #333333;
            border-bottom: 1px solid #333333;
            border-left: 1px solid #CCCCCC;
            margin: 6px;
        }

        .navlist > li {
            display: inline-block;
            margin: 6px 2px 6px 2px;
        }

        .recCard {
            width: 250px;
            border: 1px solid #000;
            border-radius 5px 5px;
            background-color: #fffffe;
            margin: 10px 0px 10px 0px;
            padding: 30px 10px 0px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }

        th{
            font-size: 20px; 
            font-family: 'Zilla Slab', serif;
            color: #16a32e;
        }

        td{
            text-align: center;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 300;
            font-size: 14px;
        }

        .leftTd{
            text-align: right;
            font-weight: bold;
        }

        .rightTd{
            text-align: left;
        }

        .recCard a {
            font-size: 20px; 
            font-family: 'Zilla Slab', serif;
            color: #16a32e;
            text-decoration: none;
        }

                /* Shared page layouts: welcome + plan make */
                .welcome-wrap {
                        width: 95%;
                        max-width: 1200px;
                        margin: auto;
                }

                .section-card {
                        background-color: #fffffe;
                        border: 1px solid #000;
                        border-radius: 8px;
                        margin: 16px 0;
                        padding: 16px;
                        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
                }

                .section-actions {
                        margin: 10px 0 16px;
                }

                .plan-grid {
                        width: 100%;
                        display: flex;
                        flex-flow: row wrap;
                        justify-content: flex-start;
                        gap: 14px;
                }

                .plan-card {
                        width: 280px;
                        padding: 12px 10px;
                }

                .plan-title {
                        display: block;
                        text-align: center;
                        font-size: 23px;
                        margin-bottom: 6px;
                }

                .plan-desc {
                        min-height: 0;
                        font-size: 14px;
                        margin: 4px 0 8px;
                        text-align: center;
                }

                .plan-recipes {
                        text-align: left;
                        margin: 6px 0 8px;
                }

                .plan-recipes-item {
                        font-size: 13px;
                        line-height: 1.25;
                        margin: 3px 0;
                }

                .plan-recipes-label {
                        display: block;
                        text-align: center;
                        font-size: 15px;
                }

                .plan-actions {
                        text-align: center;
                        margin-top: 8px;
                }

                .plan-actions a {
                        font-size: 14px;
                        margin: 0 8px;
                }

                .planmake-wrap {
                    width: 95%;
                    max-width: 760px;
                    margin: auto;
                }

                .planmake-card {
                    background-color: #fffffe;
                    border: 1px solid #000;
                    border-radius: 8px;
                    margin: 18px 0;
                    padding: 18px;
                    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
                }

                .planmake-grid {
                    display: grid;
                    grid-template-columns: 1fr;
                    gap: 8px;
                    margin-bottom: 14px;
                }

                #id_name,
                #id_description {
                    width: 100%;
                    max-width: 100%;
                    font-size: 16px;
                    font-family: 'Be Vietnam Pro', sans-serif;
                    padding: 8px;
                    box-sizing: border-box;
                }

                #id_description {
                    min-height: 90px;
                }

                .field-help {
                    margin-top: 0;
                    font-size: 14px;
                }

                .field-error {
                    color: #8b0000;
                    font-size: 14px;
                }

                .planmake-actions {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                }

                .planmake-actions .button {
                    margin: 0;
                }
        
        {% block css_style %}
        {% endblock css_style %}
    </style>

</head>

<body>
    {% block navbar %}
    <div class="navbar">
        <ul class="navlist">
        <li><a class="button" href="{% url 'welcome' %}">Account Home</a></li>
        <li><a class="button" href="{% url 'get-recipe' %}">Submit Recipe</a></li>
        <li><a class="button" href="{% url 'view-plans' %}">View Plans</a></li>
        <li><a class="button" href="{% url 'make-plan' %}">Create New Plan</a></li>
        <li><a class="button" href="{% url 'logout' %}">Logout</a></li>
        </ul>
    </div>
    {% endblock %}
    {% block page_content %} {% endblock %}
    {% block botnavbar %}
    <div class="navbar">
        <ul class="navlist">
        <li><a class="button" href="{% url 'home-postings'%}">Recipe Blog</a></li>
        <li><a class="button" href="{% url 'about' %}">About</a></li>
        <li><a class="button" href="{% url 'howto' %}">How-To</a></li>
        <li><a class="button" href="{% url 'change_log' %}">Change-Log</a></li>
        <li><a class="button" href="{% url 'ccc' %}">Attribution/Credits</a></li>
        <li><a class="button" href="https://github.com/jtweeder/mealcurator" target="_blank" rel="noopener">Git Hub Repo</a></li>
        </ul>
    </div>
    {% endblock %}
</body>
</html>
